name: CI

# ONCE A DAY, not per push — deliberately.
#
# This is a small, local-first project with a finite CI quota, and the enforcement that actually protects
# the repo runs on the contributor's machine: .githooks/pre-commit (personal-data scan) and
# .githooks/pre-push (scan + ruff + eslint + tsc + both unit suites). Burning cloud minutes to re-run what
# already ran locally buys very little.
#
# What the daily run IS for: the checks too slow for a push hook (E2E), a clean-machine install (catching
# "works because it's already on my laptop"), and drift that nobody's push would surface.
#
# Run it on demand any time from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 21 * * *"      # 02:30 IST — after the working day, before the next one
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # WealthLens-core is deliberately absent here: it is not on PyPI, and the bridge must behave
      # correctly without it (a missing engine is a STATE the UI renders — cold-start spec). Tests that
      # genuinely need a store skip themselves; the preflight tests assert the absent path on purpose.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The second half of the drift gate. pytest asserts the committed OpenAPI document matches the live
      # app; this asserts the generated types match the document. Together they mean a contract change the
      # UI has not adopted fails a check rather than a household's dashboard.
      - run: npm run types
      - run: git diff --exit-code src/api/types.ts

  e2e:
    # The three sanctioned browser flows (ADR-0010). Too slow for a push hook, so this is their scheduled
    # home — but they are runnable locally at any time with `npm run e2e`, and should be, before touching
    # a guarded flow. This job is the backstop, not the first place anyone finds out.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
