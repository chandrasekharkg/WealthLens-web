name: CI

# Both suites, every push. ADR-0010's whole argument is that the test burden must stay small enough that
# nobody is tempted to skip it — which only holds if it actually runs.
on:
  push:
  pull_request:

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # WealthLens-core is deliberately absent here: it is not on PyPI, and the bridge must behave
      # correctly without it (a missing engine is a STATE the UI renders — cold-start spec). Tests that
      # genuinely need a store skip themselves; the preflight tests assert the absent path on purpose.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
