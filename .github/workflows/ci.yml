name: CI

# The PII/secret gate runs on EVERY PR; the heavier build/test/e2e jobs stay once-a-day (quota).
#
# The author-side hooks (.githooks/pre-commit + pre-push) protect a push from a machine that has them — but a
# CONTRIBUTOR opening a GitHub PR never runs them, and `--no-verify` skips them, so personal data slipped in
# through PRs. The `secrets` job below now runs on every `pull_request`: gitleaks for generic secrets plus this
# repo's own `.githooks/pii-scan` over the PR's added lines (the same scanner the local hooks use).
#
# The build/test/e2e jobs are offline/deterministic and already ran on the author's pre-push; re-running them
# on every PR push burns finite CI quota, so they stay on the daily schedule (a clean-machine + drift + E2E
# backstop) and on-demand — not per-PR.
on:
  pull_request:
  schedule:
    - cron: "0 21 * * *"      # 02:30 IST — after the working day, before the next one
  workflow_dispatch:

jobs:
  secrets:
    name: PII / secret scan
    runs-on: ubuntu-latest
    # gitleaks-action@v2 scans a pull_request by LISTING its commits via the API (`GET /pulls/{n}/commits`),
    # which needs `pull-requests: read` — a scope the repo's default read-only GITHUB_TOKEN does NOT grant, so
    # the step 403s ("Resource not accessible by integration") and the whole gate fails red on every PR.
    # Grant it explicitly (least privilege: read-only, only the two scopes the two steps need).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # full history so the base ref + gitleaks history scan resolve
      - name: gitleaks (generic secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action@v2 REQUIRES a token to scan a pull_request (breaking change); without it the step
          # hard-exits ("GITHUB_TOKEN is now required") BEFORE the pii-scan step runs, so the whole gate fails
          # red on every PR. The auto-provisioned token is enough (read-only PR diff). Same fix as WLC 485ae98.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Personal-data scan of the PR's added lines
        if: github.event_name == 'pull_request'
        run: .githooks/pii-scan "origin/${{ github.base_ref }}...HEAD"

  bridge:
    if: github.event_name != 'pull_request'   # ran on the author's pre-push; the PR gate that matters is `secrets`
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # WealthLens-core is deliberately absent here: it is not on PyPI, and the bridge must behave
      # correctly without it (a missing engine is a STATE the UI renders — cold-start spec). Tests that
      # genuinely need a store skip themselves; the preflight tests assert the absent path on purpose.
      - run: pytest -q

  frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The second half of the drift gate. pytest asserts the committed OpenAPI document matches the live
      # app; this asserts the generated types match the document. Together they mean a contract change the
      # UI has not adopted fails a check rather than a household's dashboard.
      - run: npm run types
      - run: git diff --exit-code src/api/types.ts

  e2e:
    # The three sanctioned browser flows (ADR-0010). Too slow for a push hook, so this is their scheduled
    # home — but they are runnable locally at any time with `npm run e2e`, and should be, before touching
    # a guarded flow. This job is the backstop, not the first place anyone finds out.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # WealthLens-core is not on PyPI, and the e2e flow builds a REAL encrypted store through the engine's
      # own `init` (frontend/e2e/setup/workspace.py) — a hand-faked store would prove something else — so the
      # engine MUST be present here, unlike the bridge job which deliberately runs without it. It lives in a
      # sibling private repo; check it out with a PAT that has read access (repo secret WLC_REPO_TOKEN). This
      # job is daily/dispatch only, so the cross-repo token is never exercised on a per-PR run.
      - uses: actions/checkout@v4
        with:
          repository: chandrasekharkg/WealthLens-core
          path: WealthLens-core
          token: ${{ secrets.WLC_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # playwright.config.ts starts the webServer as `.venv/bin/python -m uvicorn`, and global-setup.ts runs
      # that same interpreter to build the throwaway workspace — so the venv must sit at the REPO ROOT with
      # both the bridge (uvicorn) and the engine (`wealthlens`, used by workspace.py) installed into it.
      - name: Set up the bridge venv (uvicorn webServer + the engine the e2e store is built with)
        working-directory: .
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "bridge[dev]"
          .venv/bin/pip install -e WealthLens-core
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the bridge serves frontend/dist (StaticFiles); without a build the SPA is a blank page and every flow
      # waits forever for a button that never renders — this job is its own checkout, so build here.
      - run: npm run build
      - run: npm run e2e
      # A Playwright timeout on CI says only "waiting for button X" — the page snapshot it captured
      # (test-results/**/error-context.md + traces) is what actually says WHY. Keep it when a flow fails.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
