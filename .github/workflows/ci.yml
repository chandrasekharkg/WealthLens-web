name: CI

# The PII/secret gate runs on EVERY PR; the heavier build/test/e2e jobs stay once-a-day (quota).
#
# The author-side hooks (.githooks/pre-commit + pre-push) protect a push from a machine that has them — but a
# CONTRIBUTOR opening a GitHub PR never runs them, and `--no-verify` skips them, so personal data slipped in
# through PRs. The `secrets` job below now runs on every `pull_request`: gitleaks for generic secrets plus this
# repo's own `.githooks/pii-scan` over the PR's added lines (the same scanner the local hooks use).
#
# The build/test/e2e jobs are offline/deterministic and already ran on the author's pre-push; re-running them
# on every PR push burns finite CI quota, so they stay on the daily schedule (a clean-machine + drift + E2E
# backstop) and on-demand — not per-PR.
on:
  pull_request:
  schedule:
    - cron: "0 21 * * *"      # 02:30 IST — after the working day, before the next one
  workflow_dispatch:

jobs:
  secrets:
    name: PII / secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # full history so the base ref + gitleaks history scan resolve
      - name: gitleaks (generic secrets)
        uses: gitleaks/gitleaks-action@v2
      - name: Personal-data scan of the PR's added lines
        if: github.event_name == 'pull_request'
        run: .githooks/pii-scan "origin/${{ github.base_ref }}...HEAD"

  bridge:
    if: github.event_name != 'pull_request'   # ran on the author's pre-push; the PR gate that matters is `secrets`
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # WealthLens-core is deliberately absent here: it is not on PyPI, and the bridge must behave
      # correctly without it (a missing engine is a STATE the UI renders — cold-start spec). Tests that
      # genuinely need a store skip themselves; the preflight tests assert the absent path on purpose.
      - run: pytest -q

  frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The second half of the drift gate. pytest asserts the committed OpenAPI document matches the live
      # app; this asserts the generated types match the document. Together they mean a contract change the
      # UI has not adopted fails a check rather than a household's dashboard.
      - run: npm run types
      - run: git diff --exit-code src/api/types.ts

  e2e:
    # The three sanctioned browser flows (ADR-0010). Too slow for a push hook, so this is their scheduled
    # home — but they are runnable locally at any time with `npm run e2e`, and should be, before touching
    # a guarded flow. This job is the backstop, not the first place anyone finds out.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
