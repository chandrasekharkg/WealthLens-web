# family.toml — the ONLY file WealthLens-web owns. Entities, their WLC workspaces, and how to present
# them. No financial data, no passwords, no keys — this file should be harmless if it were public.
# Copy to family.toml and edit (family.toml itself is gitignored; it names your machine's paths).

[family]
label = "Example family"
# The reporting currency for any view spanning more than one store (ADR-0016). Every cross-store total is
# expressed in this, and named as such. v1 supports an INR pivot — see ADR-0016 for why.
reporting_currency = "INR"

[[entity]]
id = "self"                                     # stable id used by the API and views
label = "Me"
workspace = "~/WealthLens/me-WealthLens-data"   # a WLC workspace (its store + secrets stay ITS OWN)
# owner = "self"   # WHOSE share to value. WLC weights every figure by this, and an instrument owned by a
                   # DIFFERENT entity contributes ZERO — silently. Defaults to "self", which is right for a
                   # store with no ownership rows. If a store records joint or transferred assets, set this
                   # to the entity id those rows name (`wealthlens` lens.owners() lists them).

[[entity]]
id = "spouse"
label = "Spouse"
workspace = "~/WealthLens/spouse-WealthLens-data"
# currency = "GBP"    # this entity's default, for figures spanning THEIR accounts. Individual accounts
                      # still display in their own currency — this is only the store-level default.

# An entity may span several workspaces (e.g. a legacy one beside the current) — use `workspaces`:
# [[entity]]
# id = "parent"
# label = "Dad"
# workspaces = ["~/WealthLens/dad-WealthLens-data", "~/WealthLens/dad-legacy-WealthLens-data"]

# [view] presentation preferences only — currency display, default date ranges, section order…
[view]
default = "family"                              # or an entity id
# Key-backup state (which workspaces have a confirmed store.key backup, when, and its fingerprint) is
# recorded per entity by the app — ADR-0015. A fingerprint and a date are not secrets.
