[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthlens-web"
version = "0.1.0.dev0"
description = "Local-first web bridge and UI over WealthLens-core stores"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",   # multipart uploads: the statement deposit endpoint
    # Style-preserving TOML. A plain writer would destroy the ~70 lines of comments WLC ships in
    # config.toml — the user's own documentation — on the first setting they change.
    "tomlkit>=0.13",
]

# WealthLens-core is NOT a hard dependency here, deliberately.
#
# It is not on PyPI — households install it from source, and this repo is developed against a local
# editable checkout. Making it a hard dependency would break `pip install -e .` for every contributor and
# every CI run. Instead: the bridge imports it at runtime, preflight reports its absence as a first-class
# state with a fix (cold-start spec), and the tests that need it skip when it is missing.
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["wealthlens_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:wealthlens_web.*"]

# ── lint ─────────────────────────────────────────────────────────────────────────────────────────────
# Linting from the first commit rather than retrofitted: a rule introduced later has to be argued for
# against existing code, while a rule present from the start is just how the repo is written.
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — the real bug-finders (undefined names, unused imports)
    "I",        # import order
    "UP",       # pyupgrade — keep to modern syntax as the floor rises
    "B",        # bugbear — mutable defaults, shadowed loop vars, the quiet ones
    "SIM",      # simplify
    "RUF",      # ruff's own
]
ignore = [
    "E501",     # line length is enforced by the formatter's judgement, not a hard error on a comment
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals and shadow names deliberately; that is what a test is for.
"tests/*" = ["B011", "SIM117"]

# `ruff format` is available and useful, but NOT enforced in CI: this codebase uses deliberate column
# alignment in comments and tables that a formatter would flatten. Run it if you like; the linter is the gate.

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter idiom IS a call in a default (`file: UploadFile = File(...)`), and it is not the
# mutable-default trap B008 exists to catch — the objects are declarations, not shared state. Configured
# rather than silenced per-line, so the exemption is one decision instead of a scattering of noqa comments.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form",
                          "fastapi.Header", "fastapi.Path", "fastapi.Query"]
